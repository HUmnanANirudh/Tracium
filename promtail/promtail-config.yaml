server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/log/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tracium
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
      - labels:
          service:
          level:
    static_configs:
      - targets:
          - localhost
        labels:
          job: tracium
          __path__: /var/log/services/*

  - job_name: tracium-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: tracium-api
          __path__: /var/log/tracium-api/*.log