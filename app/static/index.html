<!DOCTYPE html>
<html>
<head>
  <title>Tracium UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="bg-gray-100 p-8 font-mono h-screen flex flex-col">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Tracium Threat Intelligence</h1>
    <div id="stats" class="text-sm text-gray-500 font-bold bg-white px-4 py-2 rounded shadow"></div>
  </header>
  
  <div class="flex-1 grid grid-cols-12 gap-6 overflow-hidden">
    <!-- Left: Incident List -->
    <div class="col-span-4 bg-white rounded-lg shadow-lg flex flex-col overflow-hidden">
      <div class="bg-gray-800 text-white p-4">
        <h2 class="text-lg font-bold">Detected Threats</h2>
      </div>
      <div id="inc-list" class="flex-1 overflow-y-auto p-2 space-y-2"></div>
    </div>
    
    <!-- Right: AI Investigation Details -->
    <div class="col-span-8 bg-white rounded-lg shadow-lg flex flex-col overflow-hidden">
      <div class="bg-blue-900 text-white p-4 flex justify-between items-center">
        <h2 class="text-lg font-bold">AI Copilot Investigation</h2>
        <span id="selected-incident-id" class="text-xs text-blue-300 font-mono"></span>
      </div>
      <div id="ai-list" class="flex-1 overflow-y-auto p-6 bg-gray-50 relative">
        <div class="absolute inset-0 flex items-center justify-center text-gray-400">
          <p>Select a threat from the left to view the AI's response.</p>
        </div>
      </div>
    </div>
  </div>
  <div id="err" class="text-red-500 mt-4 text-sm font-bold"></div>
</body>
</html>
